version: "3.9"

services:
  brain-ml:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./configs:/app/configs
      - mne-cache:/app/data/MNE-eegbci-data
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  mne-cache:
